<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ridgeline</title>
<meta name="description" content="Outdoor mapping for hunting, hiking and search and rescue.">
<meta name="theme-color" content="#17221C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-32.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ridgeline">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E6EBE3; --panel:#F6F8F3; --ink:#17231C; --muted:#5A6B5F; --line:#C3CEC0;
  --accent:#D9480F; --accent-ink:#fff; --map:#E1E8DC; --grid:#C9D4C5; --good:#2F8F4E; --bad:#C0392B; --crew:#2563B8;
  --bubble:#E9EEE6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1612; --panel:#17221C; --ink:#E3EAE2; --muted:#8C9D92; --line:#2A3A30;
    --accent:#FF7A2B; --accent-ink:#1A0E05; --map:#16241C; --grid:#33493B; --good:#4CC97A; --bad:#FF6B5A; --crew:#6BA6FF;
    --bubble:#1F2D25; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1612; --panel:#17221C; --ink:#E3EAE2; --muted:#8C9D92; --line:#2A3A30;
  --accent:#FF7A2B; --accent-ink:#1A0E05; --map:#16241C; --grid:#33493B; --good:#4CC97A; --bad:#FF6B5A; --crew:#6BA6FF;
  --bubble:#1F2D25; color-scheme:dark;
}
html,body{height:100%;margin:0}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.35 'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
#teamBtn{width:42px;padding:0;border-radius:50%;font-weight:700;font-size:15px;display:grid;place-items:center}
.hr{display:flex;gap:6px;align-items:center}
header h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;font:700 21px/1 'Barlow Condensed',system-ui,sans-serif;margin:0;letter-spacing:.02em}
.btn{min-height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.chip{min-height:40px;padding:0 12px;border-radius:22px;border:1px solid var(--line);background:var(--panel);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{flex:1;position:relative;min-height:0}
.tab{position:absolute;top:0;right:0;bottom:0;left:0;display:none}
.tab.on{display:block}
#chat{flex-direction:column}
#chat.on{display:flex}
nav{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);background:var(--panel)}
nav[hidden]{display:none}
nav button{background:none;border:0;min-height:44px;font:600 17px 'Barlow Condensed',system-ui,sans-serif;color:var(--muted);border-top:3px solid transparent}
nav button[aria-selected="true"]{color:var(--ink);border-top-color:var(--accent)}
#mapwrap{position:absolute;top:0;right:0;bottom:0;left:0;background:var(--map)}
canvas{width:100%;height:100%;display:block;touch-action:none}
.float{position:absolute;border-radius:50%;width:46px;height:46px;padding:0;display:grid;place-items:center;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.25)}
#meBtn{right:12px;bottom:16px;font-size:14px}
#zin{right:12px;bottom:70px;font-size:22px}
#zout{right:12px;bottom:124px;font-size:22px}
#actions{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px}
#actions .btn{min-height:46px;padding:0 20px;border-radius:23px;font-size:17px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin:6px 0}.thumbs button{padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;aspect-ratio:1;background:var(--bg);max-width:100%}.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
label.item{cursor:pointer}
.sw{width:14px;height:14px;border-radius:4px;flex:none}
#bar{position:absolute;left:12px;right:80px;bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
#hint{position:absolute;left:16px;right:16px;top:14px;padding:10px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:16px;pointer-events:none}
#hint[hidden]{display:none}
#unit{position:absolute;top:12px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);font-size:13px;font-weight:600;background:var(--panel);border:1px solid var(--line);padding:3px 10px;border-radius:14px;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:1}
#align{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:4}
#alignImg{position:absolute;left:5%;top:5%;width:90%;height:90%;object-fit:contain;opacity:.55}
#alignBar{position:absolute;left:12px;right:12px;bottom:12px;pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
#alignBar .row{margin:2px 0}#alignBar input[type=range]{min-height:30px}
#v3dBtn{right:12px;bottom:178px;font-size:15px}
#v3d{position:absolute;top:0;right:0;bottom:0;left:0;z-index:5;background:var(--map)}
#cv3{width:100%;height:100%;display:block;touch-action:none}
#v3top{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#v3msg{background:var(--panel);padding:6px 10px;border-radius:8px;font-size:14px;border:1px solid var(--line)}#v3msg:empty{display:none}
#v3bot{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px}
#v3bot .chip{min-height:36px;padding:0 10px}#v3info{flex:1 0 100%}#v3info:empty{display:none}
#tilemsg{position:absolute;left:16px;right:16px;top:14px;z-index:2;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--panel);border:2px solid var(--accent);font-size:15px}
#tilemsg span{flex:1;min-width:0}
#tilemsg .btn{min-height:38px}
#scale{position:absolute;left:16px;bottom:72px;font-size:13px;color:var(--ink);pointer-events:none;background:var(--panel);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 6px;border-radius:6px}
#elev,#slopeLeg{position:absolute;left:16px;font-size:13px;color:var(--ink);pointer-events:none;background:var(--panel);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 6px;border-radius:6px}
#elev{bottom:96px}
#coord{position:absolute;left:16px;bottom:148px;font-size:13px;font-weight:600;color:var(--ink);pointer-events:none;background:var(--panel);background:color-mix(in srgb,var(--panel) 85%,transparent);padding:1px 6px;border-radius:6px;font-variant-numeric:tabular-nums}
#frBadge{display:inline-block;vertical-align:middle;font:700 11px/1 Barlow,system-ui,sans-serif;letter-spacing:.06em;color:#fff;background:#C0392B;padding:3px 6px;border-radius:5px;margin-left:4px}
#frBadge[hidden]{display:none}
@media (max-width:380px){header h1.fr #appName{display:none}}
#slopeLeg{bottom:122px;right:70px;font-size:12px}
#slopeLeg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 3px 0 8px;vertical-align:-1px}
#attrib{position:absolute;left:16px;bottom:52px;font-size:11px;color:var(--ink);pointer-events:none;background:var(--panel);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:1px 6px;border-radius:6px}
#backdrop{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.4);display:none;z-index:20}
#backdrop.on{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;overflow:auto;overscroll-behavior:contain;background:var(--panel);border-radius:16px 16px 0 0;border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));z-index:21;transform:translateY(105%);transition:transform .2s ease}
#sheet.on{transform:none}
#app{max-width:100vw;overflow:hidden}
@media (max-width:380px){header{padding:6px 8px;gap:6px}header .btn{padding:0 10px}header h1{font-size:18px}#windBtn{max-width:118px;overflow:hidden;text-overflow:ellipsis}}
@media (min-width:700px){#sheet{left:50%;right:auto;width:560px;border-radius:16px 16px 0 0;border:1px solid var(--line);transform:translate(-50%,105%)}#sheet.on{transform:translate(-50%,0)}#toast{max-width:480px}}
#sheet h2{font:700 22px/1.1 'Barlow Condensed',system-ui,sans-serif;margin:0 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin:6px 0}
.grid .chip{justify-content:center;border-radius:10px;padding:0 6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px;margin:6px 0}
.grid2 .item{margin:0;min-height:52px;align-items:flex-start;padding:6px 10px}
.grid2 .item .m{font-size:12px;line-height:1.25}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.plan{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--bg)}.plan.cur{border:2px solid var(--accent)}.plan h3{margin:0;font:700 21px/1.1 'Barlow Condensed',system-ui,sans-serif}.plan .price{font-weight:700;font-variant-numeric:tabular-nums}.plan ul{margin:6px 0 8px;padding-left:20px;font-size:15px}
a.btn{display:inline-flex;align-items:center;text-decoration:none;color:inherit}a.btn.primary{color:var(--accent-ink)}
.in{width:100%;min-height:48px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.lbl{font-size:13px;color:var(--muted);margin-top:8px;text-transform:uppercase;letter-spacing:.05em}
.stat{color:var(--muted);font-size:16px;margin:4px 0}
.note{font-size:14px;color:var(--muted)}
.ok{color:var(--good);font-weight:600}.no{color:var(--bad);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent);min-height:40px}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:48px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px}
.item .m{font-size:15px;color:var(--muted)}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--bg)}
details summary{min-height:48px;display:flex;align-items:center;font-weight:600;cursor:pointer}
#chatList{flex:1;overflow:auto;padding:12px 12px 4px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:84%;padding:8px 12px;border-radius:14px;background:var(--bubble);align-self:flex-start;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg .who{font-size:13px;opacity:.75;margin-bottom:2px}
.msg.bad{opacity:.6;font-style:italic}
#composer{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line);background:var(--panel)}
#gate{padding:24px 18px;max-width:460px;margin:0 auto}
#gate h2{font:700 28px/1.1 'Barlow Condensed',sans-serif;margin:0 0 8px}
[hidden]{display:none!important}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:16px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
#toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){#sheet,#toast{transition:none}}
body{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,textarea{touch-action:manipulation}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="btn" id="menuBtn">Menu</button>
    <h1><span id="appName">Ridgeline</span> <span id="frBadge" hidden>RESPONDER</span></h1>
    <div class="hr"><button class="btn" id="teamBtn" aria-label="Choose my team"></button><button class="btn" id="windBtn">Set wind</button></div>
  </header>
  <main>
    <section id="map" class="tab on" aria-label="Map">
      <div id="mapwrap"><canvas id="cv" aria-label="Map. Drag to move, pinch to zoom."></canvas></div>
      <div id="tilemsg" hidden><span id="tilemsgT"></span><button class="btn" id="tilemsgX" aria-label="Hide this message">OK</button></div>
      <div id="unit" hidden></div>
      <div id="align" hidden><img id="alignImg" alt=""><div id="alignBar"></div></div>
      <div id="hint" hidden>Drag the map until the cross is on the spot, then tap Tools.</div>
      <div id="scale"></div>
      <div id="elev" hidden></div>
      <div id="coord" hidden></div>
      <div id="slopeLeg" hidden>Steepness<i style="background:#E5C100"></i>10–20°<i style="background:#F08A24"></i>20–30°<i style="background:#D63A2F"></i>30–40°<i style="background:#8E24AA"></i>40°+<span id="slopeMsg"></span></div>
      <div id="attrib" hidden></div>
      <button class="btn float" id="zout" aria-label="Zoom out">&minus;</button>
      <button class="btn float" id="zin" aria-label="Zoom in">+</button>
      <button class="btn float" id="meBtn" aria-label="Show where I am">Me</button>
      <div id="actions"><button class="btn primary" id="addBtn">Tools</button><button class="btn" id="savedBtn">Saved</button></div>
      <div id="bar" hidden></div>
      <button class="btn float" id="v3dBtn" aria-label="Show this area in 3D">3D</button>
      <div id="v3d" hidden><canvas id="cv3" aria-label="3D terrain. Drag to turn and tilt, pinch to zoom."></canvas>
        <div id="v3top"><button class="btn primary" id="v3close">Back to 2D map</button><span id="v3msg"></span></div>
        <div id="v3bot"><span class="note">Height</span><span id="v3ex"></span><button class="btn" id="v3reset">Reset view</button><span id="v3info" class="note"></span></div></div>
    </section>
    <section id="chat" class="tab" aria-label="Crew chat">
      <div id="gate" hidden></div>
      <div id="chatList" aria-live="polite" hidden></div>
      <div id="composer" hidden>
        <input id="msgin" class="in" placeholder="Message the crew" maxlength="1000" autocomplete="off">
        <button class="btn primary" id="sendbtn">Send</button>
      </div>
    </section>
  </main>
  <nav id="nav" hidden>
    <button data-tab="map" aria-selected="true">Map</button>
    <button data-tab="chat" aria-selected="false">Crew</button>
  </nav>
</div>
<div id="backdrop"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>

<script>
(function(){

    h('div',{class:'row'},h('button',{class:'btn',text:'Log of everything on the map',onclick:openLog}),h('button',{class:'btn',text:'Projected routes',onclick:openProj}),h('button',{class:'btn',text:'Share with QR code',onclick:openShare}),h('button',{class:'btn',text:'Feedback and ideas',onclick:openFeedback})),
    h('div',{class:'lbl',text:'Your name'}),name,
    h('div',{class:'lbl',text:'Units'}),units_,
    ...bgSection(),
    ...boundsSection(),
    ...terrainSection(),
    ...installSection(),
    h('div',{class:'lbl',text:'Go to coordinates'}),go,
    h('div',{class:'row'},h('button',{class:'btn',text:'Go',onclick:()=>{const m=go.value.match(/(-?\d+(?:\.\d+)?)\s*[,\s]\s*(-?\d+(?:\.\d+)?)/);if(!m||Math.abs(+m[1])>90||Math.abs(+m[2])>180){toast('Enter latitude and longitude, like 45.1234, -90.5678.');return}view.lat=+m[1];view.lon=+m[2];view.mpp=Math.min(view.mpp,10);redraw();closeSheet()}})),
    h('div',{class:'lbl',text:'Files'}),
    h('div',{class:'row'},h('button',{class:'btn',text:'Save as GPX',onclick:()=>exportFile('gpx')}),h('button',{class:'btn',text:'Save as GeoJSON',onclick:()=>exportFile('geojson')}),h('button',{class:'btn',text:'Import a file',onclick:()=>{if(!can('files')){upsell('files');return}file.click()}}),file),
    h('div',{class:'note',text:'GPX and GeoJSON open in CalTopo, Garmin and most mapping apps. Import adds waypoints, tracks and areas from a file.'}),
    h('div',{class:'row'},h('button',{class:'btn primary',text:'Close',onclick:closeSheet})),

$('#menuBtn').addEventListener('click',openMenu);

/* crew chat, scrambled in the browser with a shared code */
let key=null,msgs=[],renderSeq=0;const dec=new Map();
const b64=u=>{let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass){const enc=new TextEncoder(),km=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode('ridgeline-crew-v1'),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function unlock(pass){try{key=await deriveKey(pass);dec.clear();LS.set('pass',pass);renderChat()}catch(e){toast('Chat could not start in this view.')}}
async function renderChat(){
  const gate=$('#gate'),list=$('#chatList'),comp=$('#composer');
  if(!dbh)return;
  if(!key){gate.hidden=false;list.hidden=true;comp.hidden=true;const pi=h('input',{class:'in',type:'password',placeholder:'Crew code','aria-label':'Crew code',autocomplete:'off'});
    gate.replaceChildren(h('h2',{text:'Join your crew'}),h('p',{text:'Pick a crew code and tell your crew in person. Everyone types the same one.'}),pi,h('div',{class:'row'},h('button',{class:'btn primary',text:'Join',onclick:()=>{if(pi.value.length<6){toast('Use at least 6 characters.');return}unlock(pi.value)}})),
      h('p',{class:'note',text:'Messages are scrambled with this code before they are stored. This is not Signal: anyone with the code can read the whole history.'}));return}
  gate.hidden=true;list.hidden=false;comp.hidden=false;
  const seq=++renderSeq,rows=[];
  for(const m of msgs){if(!dec.has(m.id)){try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(m.iv)},key,unb64(m.ct));dec.set(m.id,JSON.parse(new TextDecoder().decode(pt)))}catch(e){dec.set(m.id,null)}}rows.push([m,dec.get(m.id)])}
  if(seq!==renderSeq)return;
  const near=list.scrollHeight-list.scrollTop-list.clientHeight<80;
  list.replaceChildren(...(rows.length?rows.map(([m,d])=>{const mine=m.u===uid;if(!d)return h('div',{class:'msg bad',text:'This message was sent with a different crew code.'});
    return h('div',{class:'msg'+(mine?' me':'')},h('div',{class:'who',text:(mine?'You':String(d.n||'Crew').slice(0,24))+' · '+new Date(m.ts).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}),h('div',{text:String(d.t||'')}))}):[h('div',{class:'note',text:'No messages yet. Say something to the crew.'})]));
  if(near)list.scrollTop=list.scrollHeight}
async function send(){
  const inp=$('#msgin'),t=inp.value.trim();if(!t||!key||!dbh)return;inp.value='';
  try{const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify({n:callsign(),t})));
    await dbh.collection('chat').add({u:uid,ts:Date.now(),iv:b64(iv),ct:b64(new Uint8Array(ct))})}
  catch(e){inp.value=t;toast('Message not sent. Check your connection.')}}
$('#sendbtn').addEventListener('click',send);
$('#msgin').addEventListener('keydown',e=>{if(e.key==='Enter')send()});

/* start */
drawWindBtn();
LS.get('features',[]).forEach(f=>{if(f&&f.id){const n=normFeat(f.id,f);if(isFinite(n.la)&&isFinite(n.lo))features.set(n.id,n)}});
resize();redraw();wxFetch();
(async()=>{
  const c=window.claude;if(!c||!c.use)return;
  try{const u=await c.use('user'),id=u&&await u.id();if(id){uid=id;LS.set('uid',id)}}catch(e){}
  try{dbh=await c.use('db')}catch(e){dbh=null}
  if(!dbh)return;
  $('#nav').hidden=false;
  const localOnly=[...features.values()];features.clear();
  dbh.collection('features').onSnapshot(snap=>{snap.docChanges().forEach(ch=>{if(ch.type==='removed')features.delete(ch.doc.id);else{const f=fromDoc(ch.doc.id,ch.doc.data());if(isFinite(f.la)&&isFinite(f.lo))features.set(f.id,f)}});redraw()},()=>{});
  dbh.collection('chat').orderBy('ts','desc').limit(150).onSnapshot(s=>{msgs=s.docs.map(d=>({id:d.id,...d.data()})).reverse();if($('#chat').classList.contains('on'))renderChat()},()=>{});
  if(localOnly.length){let okAll=true;for(const f of localOnly){try{await dbh.collection('features').doc(f.id).set(toDoc(f))}catch(e){okAll=false;break}}
    if(okAll){LS.set('features',[]);toast('Moved your saved places to the shared map.')}else{localOnly.forEach(f=>features.set(f.id,f));redraw();toast('Your saved places stay on this device. This view cannot add to the shared map.')}}
  const sp=LS.get('pass',null);if(sp)unlock(sp);
})();
})();
